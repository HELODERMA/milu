<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generador de Barcode</title>
  <script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 28px; }
    h2 { margin-bottom: 8px; }
    #barcode { margin: 24px auto; }
    .row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
    .status { margin-top: 10px; color: #444; font-size: 14px; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #f2f2f2; margin: 2px 6px; font-size: 13px; }
    textarea { width: 95%; max-width: 760px; height: 120px; margin-top: 12px; font-family: monospace; }
    .muted { color: #777; }
  </style>
</head>
<body>

  <h2>Generador de Barcode</h2>
  <div class="muted">Rango: <b>1378648</b> a <b>4321502</b></div>

  <svg id="barcode"></svg>

  <div class="row">
    <button id="btnPrev" onclick="anterior()" disabled>Anterior</button>
    <button id="btnNext" onclick="siguiente()">Siguiente</button>
    <button id="btnSave" onclick="guardarActual()">Guardar</button>
    <button id="btnDownload" onclick="downloadTxt()">Descargar guardados</button>
  </div>

  <div class="status" id="info"></div>
  <div class="status">
    <span class="pill">Guardados: <b id="savedCount">0</b></span>
    <span class="pill">Posición actual: <b id="posInfo">1</b></span>
  </div>

  <h3>Códigos guardados</h3>
  <textarea id="validosBox" readonly placeholder="Aquí verás los códigos guardados..."></textarea>

  <script>
    // --- Parámetros del rango ---
    const INICIO = 1378648;
    const FIN = 4321502;
    const TOTAL = (FIN - INICIO) + 1;

    // Estado
    let indexActual = 0; // 0-based; INICIO + indexActual = código actual
    let ultimoCodigo = '';
    const guardados = [];
    const guardadosSet = new Set(); // para evitar duplicados de forma eficiente

    // Render del código de barras
    function renderCodigo() {
      const codigo = (INICIO + indexActual).toString();
      ultimoCodigo = codigo;

      JsBarcode("#barcode", codigo, {
        format: "CODE128",
        width: 3,
        height: 120,
        displayValue: true,
        fontSize: 24,
        margin: 20
      });

      // Estado visual
      document.getElementById('info').textContent =
        `Mostrando: ${codigo} (${indexActual + 1} de ${TOTAL})`;
      document.getElementById('posInfo').textContent = (indexActual + 1).toString();

      // Habilitar/Deshabilitar navegación en extremos
      document.getElementById('btnPrev').disabled = indexActual <= 0;
      document.getElementById('btnNext').disabled = indexActual >= (TOTAL - 1);
    }

    // Navegación
    function siguiente() {
      if (indexActual < TOTAL - 1) {
        indexActual++;
        renderCodigo();
      } else {
        alert("Has llegado al final del rango.");
      }
    }

    function anterior() {
      if (indexActual > 0) {
        indexActual--;
        renderCodigo();
      }
    }

    // Validación simple (si la quieres ajustar, hazlo aquí)
    function esValido(code) {
      // Aquí puedes añadir más reglas si lo requieres
      return /^\d+$/.test(code) && Number(code) >= INICIO && Number(code) <= FIN;
    }

    // Guardar el código actual si es válido (sin duplicados)
    function guardarActual() {
      if (!ultimoCodigo) {
        alert("No hay un código generado aún.");
        return;
      }
      if (!esValido(ultimoCodigo)) {
        alert(`El código ${ultimoCodigo} no es válido.`);
        return;
      }
      if (guardadosSet.has(ultimoCodigo)) {
        alert(`El código ${ultimoCodigo} ya fue guardado.`);
        return;
      }
      guardados.push(ultimoCodigo);
      guardadosSet.add(ultimoCodigo);
      renderGuardados();
    }

    function renderGuardados() {
      const box = document.getElementById('validosBox');
      box.value = guardados.join('\n');
      document.getElementById('savedCount').textContent = guardados.length.toString();
    }

    // Descargar solo los guardados
    function downloadTxt() {
      if (guardados.length === 0) {
        alert("No hay códigos guardados para descargar.");
        return;
      }
      const contenido = guardados.join('\n') + '\n';
      const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const fecha = new Date().toISOString().replace(/[:.]/g, '-');
      a.href = url;
      a.download = `codigos_guardados_${fecha}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Inicialización
    window.onload = function() {
      renderCodigo();
    };
  </script>
</body>
</html>
