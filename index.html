<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barcode Generator</title>

<script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
text-align:center;
background:#f5f5f5;
padding:20px;
}

#barcode{
margin-top:25px;
background:white;
padding:15px;
border-radius:10px;
}

.controls{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
margin-top:25px;
}

.btn{
width:80px;
height:80px;
border:none;
border-radius:16px;
background:#222;
color:white;
display:flex;
align-items:center;
justify-content:center;
}

.btn svg{
width:36px;
height:36px;
}

.btn:active{
transform:scale(0.9);
}

.save{background:#2e7d32;}
.download{background:#1565c0;}

.stepbox{
margin-top:18px;
font-size:18px;
}

select{
padding:10px;
font-size:16px;
}

textarea{
width:95%;
max-width:700px;
height:120px;
margin-top:15px;
font-family:monospace;
}

.status{
margin-top:10px;
font-size:14px;
}

</style>
</head>

<body>

<h2>Barcode Generator</h2>

<div>Rango válido: <b>1378648</b> a <b>4321502</b></div>

<svg id="barcode"></svg>

<div class="stepbox">
Paso:
<select id="stepSelect" onchange="cambiarPaso()">
<option value="1">1</option>
<option value="3">3</option>
<option value="8">8</option>
<option value="16">16</option>
<option value="32">32</option>
<option value="64">64</option>
</select>
</div>

<div class="controls">

<button onclick="retrocederPaso()" class="btn">
<i data-lucide="rewind"></i>
</button>

<button onclick="avanzarPaso()" class="btn">
<i data-lucide="fast-forward"></i>
</button>

<button onclick="guardarActual()" class="btn save">
<i data-lucide="bookmark"></i>
</button>

<button onclick="downloadTxt()" class="btn download">
<i data-lucide="download"></i>
</button>

</div>

<div class="status" id="info"></div>

<div class="status">
Guardados: <b id="savedCount">0</b>
</div>

<h3>Códigos guardados</h3>

<textarea id="validosBox" readonly></textarea>

<script>

const INICIO=1378648
const FIN=4321502

let codigoActual=INICIO
let paso=1

let ultimoCodigo=''
let guardados=[]
let guardadosSet=new Set()

function renderCodigo(){

ultimoCodigo=codigoActual.toString()

JsBarcode("#barcode",ultimoCodigo,{
format:"CODE128",
width:4,
height:150,
displayValue:true,
fontSize:28,
margin:20
})

let estado=""

if(codigoActual>=INICIO && codigoActual<=FIN){
estado="(Dentro del rango)"
}else{
estado="(Fuera del rango)"
}

document.getElementById("info").textContent=
`Mostrando ${codigoActual} ${estado}`

}

function avanzarPaso(){

codigoActual+=paso
renderCodigo()

}

function retrocederPaso(){

codigoActual-=paso
renderCodigo()

}

function cambiarPaso(){

paso=parseInt(document.getElementById("stepSelect").value)

}

function esValido(code){

const n=Number(code)

return n>=INICIO && n<=FIN

}

function guardarActual(){

if(!esValido(ultimoCodigo)){
alert("Código fuera del rango válido")
return
}

if(guardadosSet.has(ultimoCodigo))return

guardados.push(ultimoCodigo)
guardadosSet.add(ultimoCodigo)

renderGuardados()

}

function renderGuardados(){

document.getElementById("validosBox").value=guardados.join("\n")
document.getElementById("savedCount").textContent=guardados.length

}

function downloadTxt(){

if(guardados.length==0){
alert("No hay códigos guardados")
return
}

const blob=new Blob([guardados.join("\n")],{type:"text/plain"})
const url=URL.createObjectURL(blob)

const a=document.createElement("a")
a.href=url
a.download="codigos_guardados.txt"

document.body.appendChild(a)
a.click()

document.body.removeChild(a)

URL.revokeObjectURL(url)

}

renderCodigo()

lucide.createIcons()

</script>

</body>
</html>
