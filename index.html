<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barcode Generator</title>

<script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
text-align:center;
background:#f5f5f5;
padding:20px;
}

h2{
margin-bottom:5px;
}

#barcode{
margin-top:25px;
background:white;
padding:15px;
border-radius:10px;
}

.controls{
display:flex;
justify-content:center;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

.btn{
width:75px;
height:75px;
border:none;
border-radius:16px;
background:#222;
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.btn svg{
width:34px;
height:34px;
}

.btn:active{
transform:scale(0.92);
}

.save{
background:#2e7d32;
}

.download{
background:#1565c0;
}

.status{
margin-top:10px;
font-size:14px;
}

textarea{
width:95%;
max-width:700px;
height:120px;
margin-top:15px;
font-family:monospace;
}

</style>

</head>

<body>

<h2>Barcode Generator</h2>
<div>Rango: <b>1378648</b> a <b>4321502</b></div>

<svg id="barcode"></svg>

<div class="controls">

<button onclick="anterior()" class="btn">
<i data-lucide="minus"></i>
</button>

<button onclick="siguiente()" class="btn">
<i data-lucide="plus"></i>
</button>

<button onclick="guardarActual()" class="btn save">
<i data-lucide="bookmark"></i>
</button>

<button onclick="downloadTxt()" class="btn download">
<i data-lucide="download"></i>
</button>

</div>

<div class="status" id="info"></div>

<div class="status">
Guardados: <b id="savedCount">0</b>
</div>

<h3>Códigos guardados</h3>

<textarea id="validosBox" readonly></textarea>

<script>

const INICIO=1378648
const FIN=4321502
const TOTAL=(FIN-INICIO)+1

let indexActual=0
let ultimoCodigo=''
let guardados=[]
let guardadosSet=new Set()

function renderCodigo(){

const codigo=(INICIO+indexActual).toString()
ultimoCodigo=codigo

JsBarcode("#barcode",codigo,{
format:"CODE128",
width:4,
height:150,
displayValue:true,
fontSize:28,
margin:20
})

document.getElementById("info").textContent=
`Mostrando ${codigo} (${indexActual+1} de ${TOTAL})`

}

function siguiente(){

if(indexActual<TOTAL-1){
indexActual++
renderCodigo()
}else{
alert("Fin del rango")
}

}

function anterior(){

if(indexActual>0){
indexActual--
renderCodigo()
}

}

function guardarActual(){

if(guardadosSet.has(ultimoCodigo))return

guardados.push(ultimoCodigo)
guardadosSet.add(ultimoCodigo)

renderGuardados()

}

function renderGuardados(){

document.getElementById("validosBox").value=guardados.join("\n")
document.getElementById("savedCount").textContent=guardados.length

}

function downloadTxt(){

if(guardados.length==0){
alert("No hay códigos guardados")
return
}

const contenido=guardados.join("\n")

const blob=new Blob([contenido],{type:"text/plain"})

const url=URL.createObjectURL(blob)

const a=document.createElement("a")

a.href=url
a.download="codigos_guardados.txt"

document.body.appendChild(a)

a.click()

document.body.removeChild(a)

URL.revokeObjectURL(url)

}

renderCodigo()

lucide.createIcons()

/* swipe gestures */

let startX=0

document.addEventListener("touchstart",(e)=>{
startX=e.changedTouches[0].screenX
})

document.addEventListener("touchend",(e)=>{

let endX=e.changedTouches[0].screenX

if(endX-startX>50){
anterior()
}

if(startX-endX>50){
siguiente()
}

})

</script>

</body>
</html>
