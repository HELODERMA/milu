<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Barcode Generator</title>

<script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
text-align:center;
background:#f5f5f5;
padding:20px;
}

#barcode{
margin-top:25px;
background:white;
padding:15px;
border-radius:10px;
}

.controls{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-top:20px;
}

.btn{
width:70px;
height:70px;
border:none;
border-radius:14px;
background:#222;
color:white;
display:flex;
align-items:center;
justify-content:center;
}

.btn svg{
width:30px;
height:30px;
}

.btn:active{
transform:scale(0.9);
}

.save{background:#2e7d32;}
.download{background:#1565c0;}

.stepbox{
margin-top:15px;
font-size:16px;
}

select{
padding:8px;
font-size:16px;
}

textarea{
width:95%;
max-width:700px;
height:120px;
margin-top:15px;
font-family:monospace;
}

.status{
margin-top:10px;
}

</style>
</head>

<body>

<h2>Barcode Generator</h2>

<svg id="barcode"></svg>

<div class="stepbox">
Paso:
<select id="stepSelect" onchange="cambiarPaso()">
<option value="1">1</option>
<option value="3">3</option>
<option value="8">8</option>
<option value="16">16</option>
<option value="32">32</option>
<option value="64">64</option>
</select>
</div>

<div class="controls">

<button onclick="retrocederPaso()" class="btn">
<i data-lucide="rewind"></i>
</button>

<button onclick="anterior()" class="btn">
<i data-lucide="minus"></i>
</button>

<button onclick="siguiente()" class="btn">
<i data-lucide="plus"></i>
</button>

<button onclick="avanzarPaso()" class="btn">
<i data-lucide="fast-forward"></i>
</button>

<button onclick="guardarActual()" class="btn save">
<i data-lucide="bookmark"></i>
</button>

<button onclick="downloadTxt()" class="btn download">
<i data-lucide="download"></i>
</button>

</div>

<div class="status" id="info"></div>

<div class="status">
Guardados: <b id="savedCount">0</b>
</div>

<h3>Códigos guardados</h3>

<textarea id="validosBox" readonly></textarea>

<script>

const INICIO=1378648
const FIN=4321502
const TOTAL=(FIN-INICIO)+1

let indexActual=0
let paso=1

let ultimoCodigo=''
let guardados=[]
let guardadosSet=new Set()

function renderCodigo(){

const codigo=(INICIO+indexActual).toString()
ultimoCodigo=codigo

JsBarcode("#barcode",codigo,{
format:"CODE128",
width:4,
height:150,
displayValue:true,
fontSize:28,
margin:20
})

document.getElementById("info").textContent=
`Mostrando ${codigo} (${indexActual+1} de ${TOTAL})`

}

function siguiente(){
if(indexActual<TOTAL-1){
indexActual++
renderCodigo()
}
}

function anterior(){
if(indexActual>0){
indexActual--
renderCodigo()
}
}

function avanzarPaso(){

indexActual=indexActual+paso

if(indexActual>=TOTAL)
indexActual=TOTAL-1

renderCodigo()

}

function retrocederPaso(){

indexActual=indexActual-paso

if(indexActual<0)
indexActual=0

renderCodigo()

}

function cambiarPaso(){

paso=parseInt(document.getElementById("stepSelect").value)

}

function guardarActual(){

if(guardadosSet.has(ultimoCodigo))return

guardados.push(ultimoCodigo)
guardadosSet.add(ultimoCodigo)

renderGuardados()

}

function renderGuardados(){

document.getElementById("validosBox").value=guardados.join("\n")
document.getElementById("savedCount").textContent=guardados.length

}

function downloadTxt(){

if(guardados.length==0){
alert("No hay códigos guardados")
return
}

const blob=new Blob([guardados.join("\n")],{type:"text/plain"})
const url=URL.createObjectURL(blob)

const a=document.createElement("a")
a.href=url
a.download="codigos_guardados.txt"

document.body.appendChild(a)
a.click()

document.body.removeChild(a)

URL.revokeObjectURL(url)

}

renderCodigo()

lucide.createIcons()

/* swipe gestures */

let startX=0

document.addEventListener("touchstart",(e)=>{
startX=e.changedTouches[0].screenX
})

document.addEventListener("touchend",(e)=>{

let endX=e.changedTouches[0].screenX

if(endX-startX>60) anterior()
if(startX-endX>60) siguiente()

})

</script>

</body>
</html>
