<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Barcode Viewer</title>
  <script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    #barcode {
      margin: 30px auto;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Generador de Barcode</h2>

<svg id="barcode"></svg>

<br>
<button onclick="siguiente()">Siguiente</button>

<script>
let inicio = 1378647;
let actual = 0;
let cantidad = 50;

function generar() {
  const codigo = (inicio + actual).toString();
  console.log("Mostrando:", codigo);

  JsBarcode("#barcode", codigo, {
    format: "CODE128",
    width: 3,      // más grueso
    height: 120,   // más alto
    displayValue: true,
    fontSize: 24,
    margin: 20
  });
}

function siguiente() {
  if (actual < cantidad - 1) {
    actual++;
    generar();
  } else {
    alert("Ya se mostraron los 50 códigos");
  }
}

window.onload = function() {
  generar();
};
</script>

</body>
</html>
